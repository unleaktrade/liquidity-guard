name: liquidity-guard

services:
  liquidity-guard:
    build:
      context: .
      dockerfile: Dockerfile
    image: liquidity-guard:local
    container_name: liquidity-guard
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Network defaults to devnet inside the service
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      # Mandatory for startup
      USDC_MINT: ${USDC_MINT:?must set USDC_MINT (base58 pubkey)}
      SIGNING_KEY: ${SIGNING_KEY:?must set SIGNING_KEY (base58 keypair)}
      # SOLANA_RPC_FALLBACK: false
      # SOLANA_RPC_TIMEOUT_SECS: 10
      # SOLANA_RPC_POOL_MAX_IDLE: 32
      # SKIP_FUND_CHECKS: 1
      # RATE_LIMIT: 1
      # CORS: false 
      # CORS_MAX_AGE: 77
      # PORT: ${PORT:-8080}
      # LOG_FORMAT: pretty
      # RUST_LOG: info
      # METRICS_TOKEN: change-me
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
