[package]
name = "liquidity-guard"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
anyhow = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

# Solana crates pinned together
solana-client = "2.3"
solana-sdk = "2.3"
solana-rpc-client = "2.3"
reqwest = { version = "0.12", default-features = false }
actix-governor = "0.10.0"
actix-cors = "0.7"
actix-web-prom = "0.10"
prometheus = "0.14"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "tracing-log"] }

[dev-dependencies]
actix-http = "3"
base64 = "0.22"
serde_json = "1.0"
